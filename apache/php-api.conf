<VirtualHost *:80>
    ServerName api.local
    DocumentRoot "{{PROJECT_ROOT}}/public"

    <Directory "{{PROJECT_ROOT}}/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/opt/homebrew/var/run/php-fpm.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog "/private/var/log/apache2/php-api-error.log"
    CustomLog "/private/var/log/apache2/php-api-access.log" common
</VirtualHost>
